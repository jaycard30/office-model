<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dunder Mifflin - The Office</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #1a1a1a; font-family: Arial, sans-serif; }
    canvas { display: block; }
    #hud {
      position: absolute; top: 12px; left: 12px;
      color: #fff; font-size: 13px; line-height: 1.6;
      background: rgba(0,0,0,0.55); padding: 10px 14px;
      border-radius: 6px; pointer-events: none;
      border: 1px solid rgba(255,255,255,0.12);
    }
    #hud b { color: #ffd700; display: block; margin-bottom: 4px; font-size: 14px; }
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      color: rgba(255,255,255,0.7); font-size: 22px;
      pointer-events: none; text-shadow: 0 0 4px #000;
    }
    #overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.72); color: #fff; flex-direction: column;
      cursor: pointer;
    }
    #overlay h1 { font-size: 2.2em; color: #ffd700; margin-bottom: 8px; }
    #overlay p { font-size: 1.05em; opacity: 0.85; }
    #overlay.hidden { display: none; }
    #minimap {
      position: absolute; bottom: 12px; right: 12px;
      width: 160px; height: 110px;
      background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px; overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <h1>Dunder Mifflin Paper Co.</h1>
    <p>Scranton, PA &mdash; Branch Office</p>
    <p style="margin-top:16px; font-size:0.95em; opacity:0.7;">Click to explore &bull; WASD to move &bull; Mouse to look &bull; Shift to run</p>
  </div>
  <div id="hud">
    <b>Dunder Mifflin &mdash; Scranton</b>
    WASD / Arrows: Move &nbsp;|&nbsp; Mouse: Look<br>
    Shift: Run &nbsp;|&nbsp; ESC: Release cursor
  </div>
  <div id="crosshair">+</div>
  <canvas id="minimap"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

RectAreaLightUniformsLib.init();

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc8d8e8);
scene.fog = new THREE.Fog(0xd0c8bc, 18, 55);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.05, 80);
camera.position.set(1, 1.72, 7.5);

const controls = new PointerLockControls(camera, renderer.domElement);
scene.add(controls.getObject());

const overlay = document.getElementById('overlay');
overlay.addEventListener('click', () => controls.lock());
controls.addEventListener('lock', () => overlay.classList.add('hidden'));
controls.addEventListener('unlock', () => overlay.classList.remove('hidden'));

const M = {
  carpet:      new THREE.MeshStandardMaterial({ color: 0x7a6b52, roughness: 0.98 }),
  carpetConf:  new THREE.MeshStandardMaterial({ color: 0x5a6a7a, roughness: 0.98 }),
  wallOff:     new THREE.MeshStandardMaterial({ color: 0xe2ddd4, roughness: 0.85 }),
  wallGlass:   new THREE.MeshStandardMaterial({ color: 0xb8d4e8, transparent: true, opacity: 0.22, roughness: 0.05, side: THREE.DoubleSide }),
  deskLight:   new THREE.MeshStandardMaterial({ color: 0xc8a870, roughness: 0.55 }),
  deskDark:    new THREE.MeshStandardMaterial({ color: 0x5c3318, roughness: 0.6 }),
  metal:       new THREE.MeshStandardMaterial({ color: 0x909090, metalness: 0.75, roughness: 0.3 }),
  wood:        new THREE.MeshStandardMaterial({ color: 0x7a5428, roughness: 0.7 }),
  woodLight:   new THREE.MeshStandardMaterial({ color: 0xb07840, roughness: 0.65 }),
  whiteboard:  new THREE.MeshStandardMaterial({ color: 0xf8f8f6, roughness: 0.4 }),
  screen:      new THREE.MeshStandardMaterial({ color: 0x2255aa, emissive: 0x102040, emissiveIntensity: 0.8, roughness: 0.1 }),
  screenDark:  new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.25, metalness: 0.5 }),
  cubicle:     new THREE.MeshStandardMaterial({ color: 0x9e8e7a, roughness: 0.92 }),
  cubicleTop:  new THREE.MeshStandardMaterial({ color: 0x7a6b58, roughness: 0.9 }),
  filingCab:   new THREE.MeshStandardMaterial({ color: 0x828278, metalness: 0.55, roughness: 0.45 }),
  paper:       new THREE.MeshStandardMaterial({ color: 0xfcfcf4, roughness: 0.92 }),
  blinds:      new THREE.MeshStandardMaterial({ color: 0xd8ceaa, roughness: 0.8, side: THREE.DoubleSide }),
  couchBrown:  new THREE.MeshStandardMaterial({ color: 0x7a4820, roughness: 0.88 }),
  windowGlow:  new THREE.MeshStandardMaterial({ color: 0xd8eeff, emissive: 0x6090c0, emissiveIntensity: 0.4, transparent: true, opacity: 0.35 }),
  fluorescent: new THREE.MeshStandardMaterial({ color: 0xfff8e8, emissive: 0xfff0c8, emissiveIntensity: 3.5, roughness: 0.1 }),
  lightFix:    new THREE.MeshStandardMaterial({ color: 0xe8e8e0, roughness: 0.6 }),
  plastic:     new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.4 }),
  black:       new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.7 }),
  navy:        new THREE.MeshStandardMaterial({ color: 0x0a2060, roughness: 0.6 }),
  gold:        new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 }),
  red:         new THREE.MeshStandardMaterial({ color: 0xaa2222, roughness: 0.7 }),
  blue:        new THREE.MeshStandardMaterial({ color: 0x2244aa, roughness: 0.6 }),
  gridMat:     new THREE.MeshStandardMaterial({ color: 0xb8b5b0, roughness: 0.7 }),
};

const _bg = {};
function bGeo(w,h,d) { const k=`${w},${h},${d}`; if(!_bg[k]) _bg[k]=new THREE.BoxGeometry(w,h,d); return _bg[k]; }
function b(w,h,d,mat,x,y,z,rx=0,ry=0,rz=0) {
  const m=new THREE.Mesh(bGeo(w,h,d),mat); m.position.set(x,y,z); m.rotation.set(rx,ry,rz);
  m.castShadow=true; m.receiveShadow=true; scene.add(m); return m;
}
function cyl(rt,rb,h,seg,mat,x,y,z,rx=0,ry=0,rz=0) {
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat); m.position.set(x,y,z); m.rotation.set(rx,ry,rz);
  m.castShadow=true; m.receiveShadow=true; scene.add(m); return m;
}
function sph(r,seg,mat,x,y,z) {
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,seg,seg),mat); m.position.set(x,y,z);
  m.castShadow=true; m.receiveShadow=true; scene.add(m); return m;
}

const CH=3.05, EYE=1.72;

// Lighting
scene.add(new THREE.AmbientLight(0xfff5e8, 0.55));
const sun=new THREE.DirectionalLight(0xfff8f0,0.6);
sun.position.set(8,12,18); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-25; sun.shadow.camera.right=25;
sun.shadow.camera.top=20; sun.shadow.camera.bottom=-20;
sun.shadow.camera.far=60; sun.shadow.bias=-0.001;
scene.add(sun);

function fluoro(x,z,len=1.1) {
  b(len,0.06,0.28,M.lightFix,x,CH-0.03,z);
  b(len-0.05,0.025,0.08,M.fluorescent,x,CH-0.035,z);
  const rl=new THREE.RectAreaLight(0xfff8e4,14,len,0.28);
  rl.position.set(x,CH-0.07,z); rl.rotation.x=Math.PI/2; scene.add(rl);
  const pl=new THREE.PointLight(0xfff5dc,1.4,7,1.8);
  pl.position.set(x,CH-0.15,z); pl.castShadow=true;
  pl.shadow.mapSize.set(256,256); pl.shadow.bias=-0.002; scene.add(pl);
}
for(let xi=-1;xi<=10;xi+=3.2) for(let zi=-6.5;zi<=2.5;zi+=3.0) fluoro(xi,zi);
fluoro(-9.5,-5.8); fluoro(-9.5,-3.8);
fluoro(-9.8,-0.5); fluoro(-8.4,-0.5); fluoro(-9.1,1.5);
fluoro(-9.8,5.2); fluoro(-8.5,5.2);
fluoro(9.5,5.5); fluoro(9.5,7.0);
fluoro(1.0,5.8); fluoro(3.5,5.8);

// Floors
b(22,0.06,14,M.carpet,1,-0.03,-1);
b(6,0.06,7,M.carpetConf,-9,-0.03,-0.5);
b(9,0.06,5,new THREE.MeshStandardMaterial({color:0xd8d0c0,roughness:0.6}),3,-0.03,6);
b(6,0.06,6,new THREE.MeshStandardMaterial({color:0xc8c0a8,roughness:0.7}),-9,-0.03,5.5);
b(6,0.06,6,new THREE.MeshStandardMaterial({color:0x8a7c6a,roughness:0.95}),9,-0.03,5.5);

// Ceiling tiles
const tW=1.22,tD=0.61;
const tMats=[new THREE.MeshStandardMaterial({color:0xf0ede8,roughness:0.96}),new THREE.MeshStandardMaterial({color:0xece9e4,roughness:0.96})];
for(let xi=-11;xi<12;xi+=tW) for(let zi=-8;zi<9;zi+=tD) {
  const m=new THREE.Mesh(bGeo(tW-0.012,0.04,tD-0.012),tMats[(Math.floor(xi+zi))&1]);
  m.position.set(xi+tW/2,CH,zi+tD/2); m.receiveShadow=true; scene.add(m);
}
for(let xi=-11;xi<=11;xi+=tW) b(0.025,0.025,18,M.gridMat,xi,CH+0.012,0);
for(let zi=-8;zi<=9;zi+=tD) b(24,0.025,0.025,M.gridMat,0,CH+0.012,zi);

// Exterior walls
b(24,CH,0.12,M.wallOff,0,CH/2,-8);
b(0.12,CH,17,M.wallOff,-12,CH/2,0.5);
b(0.12,CH,17,M.wallOff,12,CH/2,0.5);
b(7,CH,0.12,M.wallOff,-8.5,CH/2,8.5);
b(7,CH,0.12,M.wallOff,8.5,CH/2,8.5);
b(10,0.9,0.12,M.wallOff,0,0.45,8.5);
b(10,CH-0.9,0.12,M.wallGlass,0,0.9+(CH-0.9)/2,8.5);

// Windows
function win(x,y,z,w,h,ax) {
  const f=new THREE.MeshStandardMaterial({color:0xd0cfc8,roughness:0.5});
  if(ax==='z'){b(w+0.08,h+0.08,0.06,f,x,y,z);b(w,h,0.04,M.windowGlow,x,y,z);}
  else{b(0.06,h+0.08,w+0.08,f,x,y,z);b(0.04,h,w,M.windowGlow,x,y,z);}
}
win(-4,2,-8,2.5,1.4,'z'); win(2,2,-8,2.5,1.4,'z'); win(7,2,-8,2.5,1.4,'z');
win(-12,2,-5.5,2,1.4,'x'); win(-12,2,-4,2,1.4,'x');
win(-7,2,8.5,2.5,1.4,'z'); win(7,2,8.5,2.5,1.4,'z');
function blinds(x,y,z,w,ax) {
  for(let i=0;i<14;i++){const yy=y-0.6+i*(1.2/14);
    if(ax==='z')b(w-0.05,0.035,0.01,M.blinds,x,yy,z-0.04);
    else b(0.01,0.035,w-0.05,M.blinds,x-0.04,yy,z);}
}
blinds(-4,2,-8,2.5,'z'); blinds(2,2,-8,2.5,'z'); blinds(7,2,-8,2.5,'z');
blinds(-12,2,-5.5,2,'x'); blinds(-12,2,-4,2,'x');
const wl=new THREE.SpotLight(0xd8eeff,1.2,12,0.6,0.5);
wl.position.set(-11,2.5,-5); wl.target.position.set(0,0,0); scene.add(wl); scene.add(wl.target);

// Interior walls - Michael's office
b(5,CH,0.12,M.wallGlass,-9.5,CH/2,-3);
b(0.12,CH,1.6,M.wallGlass,-7,CH/2,-3.8);
b(0.12,0.8,1.2,M.wallGlass,-7,CH-0.4,-4.7);
b(0.12,CH,2.2,M.wallGlass,-7,CH/2,-6.5);
b(5,CH,0.12,M.wallOff,-9.5,CH/2,-3);
// Conference room
b(0.12,CH,2,M.wallGlass,-7,CH/2,-1.5);
b(0.12,0.8,1.2,M.wallGlass,-7,CH-0.4,0.1);
b(0.12,CH,2.6,M.wallGlass,-7,CH/2,2);
b(5,CH,0.12,M.wallGlass,-9.5,CH/2,3.8);
// Break room
b(0.12,CH,4.5,M.wallOff,-7,CH/2,6.25);
b(5,CH,0.12,M.wallOff,-9.5,CH/2,4);
// Annex
b(0.12,CH,4.7,M.wallOff,7,CH/2,6.15);
b(5,CH,0.12,M.wallOff,9.5,CH/2,3.8);

// Monitor helper
function mon(x,y,z,ry=0){
  const g=new THREE.Group();
  const sc=new THREE.Mesh(bGeo(0.44,0.33,0.04),M.screenDark); sc.position.y=0.165; g.add(sc);
  const sf=new THREE.Mesh(bGeo(0.40,0.29,0.015),M.screen); sf.position.set(0,0.165,0.028); g.add(sf);
  const nk=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,0.22,8),M.metal); nk.position.y=-0.11; g.add(nk);
  const bs=new THREE.Mesh(bGeo(0.2,0.018,0.16),M.metal); bs.position.y=-0.23; g.add(bs);
  g.position.set(x,y+0.34,z); g.rotation.y=ry;
  g.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;}}); scene.add(g);
}

// Chair helper
function chair(x,z,ry=0,col=0x1c1c1c){
  const mat=new THREE.MeshStandardMaterial({color:col,roughness:0.8});
  const g=new THREE.Group();
  const se=new THREE.Mesh(bGeo(0.52,0.08,0.5),mat); se.position.y=0.5; g.add(se);
  const bk=new THREE.Mesh(bGeo(0.5,0.58,0.07),mat); bk.position.set(0,0.84,-0.22); g.add(bk);
  const po=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.45,8),M.metal); po.position.y=0.23; g.add(po);
  const st=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,0.035,5),M.metal); st.position.y=0.035; g.add(st);
  [-0.27,0.27].forEach(ox=>{const ar=new THREE.Mesh(bGeo(0.055,0.055,0.32),mat); ar.position.set(ox,0.7,-0.05); g.add(ar);});
  g.position.set(x,0,z); g.rotation.y=ry;
  g.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;}}); scene.add(g);
}

// Desk helper
function desk(x,z,ry=0){
  const g=new THREE.Group();
  const tp=new THREE.Mesh(bGeo(1.55,0.05,0.82),M.deskLight); tp.position.y=0.76; g.add(tp);
  [[-0.68,-0.36],[0.68,-0.36],[-0.68,0.36],[0.68,0.36]].forEach(([lx,lz])=>{
    const lg=new THREE.Mesh(bGeo(0.05,0.76,0.05),M.deskLight); lg.position.set(lx,0.38,lz); g.add(lg);});
  const pd=new THREE.Mesh(bGeo(0.42,0.62,0.52),M.deskLight); pd.position.set(0.52,0.31,0); g.add(pd);
  g.position.set(x,0,z); g.rotation.y=ry;
  g.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;}}); scene.add(g);
}

// Divider helper
function div(x,z,len,ry=0,h=1.32){
  const g=new THREE.Group();
  const pn=new THREE.Mesh(bGeo(len,h,0.055),M.cubicle); pn.position.y=h/2; g.add(pn);
  const tp=new THREE.Mesh(bGeo(len+0.02,0.04,0.065),M.cubicleTop); tp.position.y=h; g.add(tp);
  g.position.set(x,0,z); g.rotation.y=ry;
  g.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;}}); scene.add(g);
}

// Reception
b(3.8,1.1,0.55,M.deskDark,0.2,0.55,6.6);
b(3.9,0.05,0.6,M.deskLight,0.2,1.1,6.6);
b(0.55,1.1,2.2,M.deskDark,2.25,0.55,5.6);
b(0.6,0.05,2.3,M.deskLight,2.25,1.1,5.6);
b(0.9,0.08,0.02,M.navy,0.2,0.65,6.3);
b(0.2,0.04,0.14,M.plastic,-0.8,1.12,6.35);
b(0.08,0.12,0.08,new THREE.MeshStandardMaterial({color:0xff6699,roughness:0.8}),-0.6,1.12,6.42);
b(0.15,0.22,0.08,new THREE.MeshStandardMaterial({color:0x556b8a,roughness:0.7}),-0.3,1.12,6.35);
mon(0.9,1.08,6.3,Math.PI);
chair(-0.2,6.1,Math.PI);

// Waiting sofa
(function(){
  const g=new THREE.Group(), mat=M.couchBrown, w=2.4;
  const se=new THREE.Mesh(bGeo(w,0.2,0.72),mat); se.position.y=0.44; g.add(se);
  const bk=new THREE.Mesh(bGeo(w,0.52,0.14),mat); bk.position.set(0,0.78,-0.29); g.add(bk);
  [-w/2,w/2].forEach(ox=>{const ar=new THREE.Mesh(bGeo(0.14,0.54,0.72),mat); ar.position.set(ox,0.61,0); g.add(ar);});
  g.position.set(4.5,0,7.5); g.rotation.y=Math.PI;
  g.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;}}); scene.add(g);
})();
b(1.0,0.04,0.55,M.deskDark,4.5,0.46,6.7);
b(0.24,0.008,0.18,M.red,4.3,0.48,6.75);
b(0.22,0.008,0.16,M.blue,4.55,0.49,6.65);

// Bullpen desks
desk(-1.2,-3.2,0); mon(-1.2,0.78,-3.4); chair(-1.2,-2.4,Math.PI);
b(0.28,0.03,0.08,new THREE.MeshStandardMaterial({color:0x8b4513}),-1.0,0.79,-3.0);
b(0.14,0.12,0.05,new THREE.MeshStandardMaterial({color:0x882222}),-0.7,0.8,-3.15);
desk(-1.2,-1.6,Math.PI); mon(-1.2,0.78,-1.4,Math.PI); chair(-1.2,-2.4,0);
b(0.1,0.1,0.08,new THREE.MeshStandardMaterial({color:0xcc8844}),-1.6,0.8,-1.52);
div(-2.5,-2.4,2.5,0); div(-1.2,-4.2,2.8,Math.PI/2); div(-1.2,-0.6,2.8,Math.PI/2);

desk(1.5,-3.2,0); mon(1.5,0.78,-3.4); chair(1.5,-2.4,Math.PI);
b(0.18,0.14,0.04,new THREE.MeshStandardMaterial({color:0x336688}),1.8,0.8,-3.05);
desk(1.5,-1.6,Math.PI); mon(1.5,0.78,-1.4,Math.PI); chair(1.5,-2.4,0);
b(0.12,0.1,0.08,new THREE.MeshStandardMaterial({color:0x885522}),1.9,0.8,-1.55);
div(0.2,-2.4,2.5,0); div(1.5,-4.2,2.8,Math.PI/2); div(1.5,-0.6,2.8,Math.PI/2);

desk(4.2,-3.8,0); mon(4.2,0.78,-4.0); chair(4.2,-3.0,Math.PI);
[0,0.08,0.16,0.24].forEach((ox,i)=>{
  const c=new THREE.MeshStandardMaterial({color:[0xffcc88,0x886644,0xf5f5f5,0x444444][i]});
  b(0.04,0.07,0.04,c,3.9+ox,0.82,-3.68); b(0.03,0.04,0.03,c,3.9+ox,0.9,-3.68);
});
div(2.9,-2.4,2.5,0); div(4.2,-5.0,3.0,Math.PI/2);

desk(5.8,-2.4,0); mon(5.8,0.78,-2.6); chair(5.8,-1.6,Math.PI);
desk(8.0,-2.4,0); mon(8.0,0.78,-2.6); chair(8.0,-1.6,Math.PI);
b(0.22,0.005,0.25,M.paper,8.3,0.79,-2.2);
desk(5.5,0.5,0); mon(5.5,0.78,0.3); chair(5.5,1.3,Math.PI);
desk(8.0,0.5,0); mon(8.0,0.78,0.3); chair(8.0,1.3,Math.PI);
desk(5.5,-5.5,0); mon(5.5,0.78,-5.7); chair(5.5,-4.7,Math.PI);

// Filing cabinets
[[-5.5,-7.5],[-6.1,-7.5],[-6.7,-7.5],[10.5,-6.5],[11.0,-6.5],[10.5,-4.5],[11.0,-4.5],[10.5,-2.5]]
  .forEach(([x,z])=>{b(0.48,1.1,0.62,M.filingCab,x,0.55,z); for(let i=0;i<3;i++) b(0.32,0.018,0.01,M.metal,x,0.22+i*0.35,z+0.32);});

// Printer

// Minimap
const mc=document.getElementById('minimap'), mx=mc.getContext('2d');
mc.width=160; mc.height=110;
function drawMap(){
  mx.fillStyle='rgba(20,18,14,0.88)'; mx.fillRect(0,0,160,110);
  const sc=5.5,ox=80,oz=55;
  const wx=x=>ox+x*sc, wz=z=>oz+z*sc;
  mx.strokeStyle='#888'; mx.lineWidth=1;
  mx.strokeRect(wx(-12),wz(-8),24*sc,17*sc);
  mx.strokeStyle='#4af'; mx.lineWidth=0.6;
  mx.strokeRect(wx(-12),wz(-8),5*sc,5*sc);
  mx.strokeRect(wx(-12),wz(-3),5*sc,7*sc);
  mx.strokeStyle='#8f8'; mx.lineWidth=0.6;
  mx.strokeRect(wx(-12),wz(4),5*sc,4.5*sc);
  mx.strokeRect(wx(7),wz(4),5*sc,4.5*sc);
  const px=camera.position.x,pz=camera.position.z;
  mx.fillStyle='#ff4'; mx.beginPath(); mx.arc(wx(px),wz(pz),2.5,0,Math.PI*2); mx.fill();
  const dir=new THREE.Vector3(); camera.getWorldDirection(dir);
  mx.strokeStyle='#ff4'; mx.lineWidth=1;
  mx.beginPath(); mx.moveTo(wx(px),wz(pz)); mx.lineTo(wx(px+dir.x*2.5),wz(pz+dir.z*2.5)); mx.stroke();
  mx.fillStyle='rgba(255,255,200,0.6)'; mx.font='7px Arial';
  mx.fillText('M',wx(-10.5),wz(-5.5));
  mx.fillText('Conf',wx(-11.5),wz(0.2));
  mx.fillText('Break',wx(-11.8),wz(5.2));
  mx.fillText('Annex',wx(7.2),wz(5.2));
  mx.fillText('Recep.',wx(-1),wz(6.8));
}

function animate(){
  requestAnimationFrame(animate);
  const delta=Math.min(clock.getDelta(),0.05);
  const speed=(keys['ShiftLeft']||keys['ShiftRight'])?7.5:3.5;
  velocity.x-=velocity.x*12*delta;
  velocity.z-=velocity.z*12*delta;
  if(controls.isLocked){
    const fwd=(keys['KeyW']||keys['ArrowUp'])?1:0;
    const bwd=(keys['KeyS']||keys['ArrowDown'])?1:0;
    const lft=(keys['KeyA']||keys['ArrowLeft'])?1:0;
    const rgt=(keys['KeyD']||keys['ArrowRight'])?1:0;
    velocity.z-=(fwd-bwd)*speed*delta*14;
    velocity.x-=(lft-rgt)*speed*delta*14;
    controls.moveForward(-velocity.z*delta);
    controls.moveRight(-velocity.x*delta);
    const pos=controls.getObject().position;
    pos.x=Math.max(-11.5,Math.min(11.5,pos.x));
    pos.z=Math.max(-7.7,Math.min(8.2,pos.z));
    pos.y=EYE;
  }
  drawMap();
  renderer.render(scene,camera);
}
