<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dunder Mifflin — The Office</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{overflow:hidden;background:#111;font-family:Arial,sans-serif}
    canvas{display:block}
    #hud{
      position:absolute;top:12px;left:12px;color:#fff;font-size:13px;line-height:1.7;
      background:rgba(0,0,0,.6);padding:10px 14px;border-radius:6px;
      pointer-events:none;border:1px solid rgba(255,255,255,.12)
    }
    #hud b{color:#ffd700;display:block;margin-bottom:3px;font-size:14px}
    #crosshair{
      position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      color:rgba(255,255,255,.7);font-size:22px;pointer-events:none;text-shadow:0 0 4px #000
    }
    #overlay{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      background:rgba(0,0,0,.75);color:#fff;flex-direction:column;cursor:pointer
    }
    #overlay h1{font-size:2.2em;color:#ffd700;margin-bottom:8px}
    #overlay p{font-size:1em;opacity:.85}
    #overlay.hidden{display:none}
    #minimap{
      position:absolute;bottom:12px;right:12px;width:160px;height:110px;
      background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);border-radius:4px
    }
  </style>
</head>
<body>
  <div id="overlay">
    <h1>Dunder Mifflin Paper Co.</h1>
    <p>Scranton, PA &mdash; Branch Office</p>
    <p style="margin-top:14px;font-size:.9em;opacity:.65">Click to explore &bull; WASD to move &bull; Mouse to look &bull; Shift to run &bull; ESC to pause</p>
  </div>
  <div id="hud">
    <b>Dunder Mifflin &mdash; Scranton</b>
    WASD / Arrows: Move &nbsp;|&nbsp; Mouse: Look<br>
    Shift: Run &nbsp;|&nbsp; ESC: Release cursor
  </div>
  <div id="crosshair">+</div>
  <canvas id="minimap"></canvas>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { PointerLockControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/PointerLockControls.js';

// ── Renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// ── Scene / Camera ────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8ccd8);
scene.fog = new THREE.Fog(0xc8beb0, 20, 52);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 70);
camera.position.set(1, 1.72, 7.2);

// ── Controls ──────────────────────────────────────────────────────────────────
const controls = new PointerLockControls(camera, renderer.domElement);
scene.add(controls.getObject());
const overlay = document.getElementById('overlay');
overlay.addEventListener('click', () => controls.lock());
controls.addEventListener('lock',   () => overlay.classList.add('hidden'));
controls.addEventListener('unlock', () => overlay.classList.remove('hidden'));

// ── Materials ─────────────────────────────────────────────────────────────────
function mat(color, roughness=0.85, metalness=0, opts={}) {
  return new THREE.MeshStandardMaterial({ color, roughness, metalness, ...opts });
}
const M = {
  carpet:     mat(0x7a6b52, 0.98),
  carpetB:    mat(0x5a6070, 0.98),
  recepTile:  mat(0xd8d0c0, 0.6),
  breakFloor: mat(0xc8c0a8, 0.7),
  annexCarpet:mat(0x8a7c6a, 0.95),
  wall:       mat(0xe2ddd4, 0.85),
  wallGlass:  mat(0xb8d4e8, 0.05, 0, { transparent:true, opacity:0.22, side:THREE.DoubleSide }),
  ceiling:    mat(0xf0ede8, 0.96),
  ceilGrid:   mat(0xb8b5b0, 0.7),
  deskL:      mat(0xc8a870, 0.55),
  deskD:      mat(0x5c3318, 0.6),
  deskExec:   mat(0x4a2810, 0.65),
  chairBlk:   mat(0x1c1c1c, 0.8),
  metal:      mat(0x909090, 0.3, 0.75),
  wood:       mat(0x7a5428, 0.7),
  woodL:      mat(0xb07840, 0.65),
  whiteboard: mat(0xf8f8f6, 0.4),
  screen:     mat(0x2255aa, 0.1, 0, { emissive:0x102040, emissiveIntensity:0.8 }),
  screenCase: mat(0x111111, 0.25, 0.5),
  cubicle:    mat(0x9e8e7a, 0.92),
  cubicleTop: mat(0x7a6b58, 0.9),
  filingCab:  mat(0x828278, 0.45, 0.55),
  paper:      mat(0xfcfcf4, 0.92),
  blinds:     mat(0xd8ceaa, 0.8, 0, { side:THREE.DoubleSide }),
  couch:      mat(0x7a4820, 0.88),
  winGlow:    mat(0xd8eeff, 0.05, 0, { emissive:0x6090c0, emissiveIntensity:0.45, transparent:true, opacity:0.35 }),
  fluoTube:   mat(0xfff8e8, 0.1, 0, { emissive:0xfff0c8, emissiveIntensity:4 }),
  fluoHouse:  mat(0xe8e8e0, 0.6),
  plastic:    mat(0xcccccc, 0.4),
  black:      mat(0x111111, 0.7),
  navy:       mat(0x0a2060, 0.6),
  gold:       mat(0xffd700, 0.2, 0.8),
  red:        mat(0xaa2222, 0.7),
  blue:       mat(0x2244aa, 0.6),
  green:      mat(0x228822, 0.9),
  pink:       mat(0xff69b4, 0.7),
  brown:      mat(0x8b4513, 0.7),
};

// ── Geometry helpers ──────────────────────────────────────────────────────────
const _bg = {};
function bg(w,h,d){ const k=`${w},${h},${d}`; if(!_bg[k]) _bg[k]=new THREE.BoxGeometry(w,h,d); return _bg[k]; }
function b(w,h,d,m,x,y,z,rx=0,ry=0,rz=0){
  const mesh=new THREE.Mesh(bg(w,h,d),m); mesh.position.set(x,y,z); mesh.rotation.set(rx,ry,rz);
  mesh.castShadow=true; mesh.receiveShadow=true; scene.add(mesh); return mesh;
}
function cyl(rt,rb,h,s,m,x,y,z,rx=0,ry=0,rz=0){
  const mesh=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,s),m);
  mesh.position.set(x,y,z); mesh.rotation.set(rx,ry,rz);
  mesh.castShadow=true; mesh.receiveShadow=true; scene.add(mesh); return mesh;
}
function sph(r,s,m,x,y,z){
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(r,s,s),m);
  mesh.position.set(x,y,z); mesh.castShadow=true; mesh.receiveShadow=true; scene.add(mesh); return mesh;
}

const CH=3.05, EY=1.72;

// ── Lighting ──────────────────────────────────────────────────────────────────
// Warm ambient fill
scene.add(new THREE.AmbientLight(0xfff5e8, 0.65));

// One directional "sun" light with shadows (only shadow caster)
const sun = new THREE.DirectionalLight(0xfff8f0, 0.55);
sun.position.set(8, 14, 16);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -28; sun.shadow.camera.right = 28;
sun.shadow.camera.top  =  22; sun.shadow.camera.bottom = -22;
sun.shadow.camera.far  =  60; sun.shadow.bias = -0.001;
scene.add(sun);

// Fluorescent fixtures — emissive geometry + cheap non-shadow point lights
function fluoro(x, z, len=1.1) {
  b(len, 0.06, 0.28, M.fluoHouse, x, CH-0.03, z);
  b(len-0.06, 0.022, 0.1, M.fluoTube, x, CH-0.032, z);
  const pl = new THREE.PointLight(0xfff5dc, 1.2, 6.5, 1.9);
  pl.position.set(x, CH-0.18, z);
  scene.add(pl);  // no shadow casting — avoids WebGL shadow-map limit
}
for (let xi=-1; xi<=10; xi+=3.2) for (let zi=-6.5; zi<=2.5; zi+=3.0) fluoro(xi, zi);
fluoro(-9.5,-5.8); fluoro(-9.5,-3.8);
fluoro(-9.8,-0.5); fluoro(-8.4,-0.5); fluoro(-9.1,1.5);
fluoro(-9.8,5.2); fluoro(-8.5,5.2);
fluoro(9.5,5.5); fluoro(9.5,7.0);
fluoro(1.0,5.8); fluoro(3.5,5.8);

// Window fill light
const wfill = new THREE.SpotLight(0xd8eeff, 1.0, 14, 0.65, 0.5);
wfill.position.set(-11, 3, -5); wfill.target.position.set(2, 0, 0);
scene.add(wfill); scene.add(wfill.target);

// ── Floors ────────────────────────────────────────────────────────────────────
b(22,0.06,14, M.carpet,     1,   -0.03, -1);
b( 6,0.06, 7, M.carpetB,   -9,   -0.03, -0.5);
b( 9,0.06, 5, M.recepTile,  3,   -0.03,  6);
b( 6,0.06, 6, M.breakFloor,-9,   -0.03,  5.5);
b( 6,0.06, 6, M.annexCarpet,9,  -0.03,  5.5);

// ── Ceiling tiles ─────────────────────────────────────────────────────────────
const tW=1.22, tD=0.61;
const tA=mat(0xf0ede8,0.96), tB=mat(0xece9e4,0.96);
for (let xi=-11; xi<12; xi+=tW) for (let zi=-8; zi<9; zi+=tD) {
  const m2=new THREE.Mesh(bg(tW-0.012,0.04,tD-0.012),(Math.floor(xi+zi)&1)?tB:tA);
  m2.position.set(xi+tW/2,CH,zi+tD/2); m2.receiveShadow=true; scene.add(m2);
}
for (let xi=-11; xi<=11; xi+=tW) b(0.022,0.022,18,M.ceilGrid,xi,CH+0.011,0);
for (let zi=-8;  zi<=9;  zi+=tD) b(24,0.022,0.022,M.ceilGrid, 0,CH+0.011,zi);

// ── Exterior walls ────────────────────────────────────────────────────────────
b(24,CH,0.12,M.wall, 0,CH/2,-8);   // north
b(0.12,CH,17,M.wall,-12,CH/2,0.5); // west
b(0.12,CH,17,M.wall, 12,CH/2,0.5); // east
b(7,CH,0.12,M.wall, -8.5,CH/2,8.5); // south-left
b(7,CH,0.12,M.wall,  8.5,CH/2,8.5); // south-right
b(10,0.9,0.12,M.wall,  0,0.45,8.5); // reception sill
b(10,CH-0.9,0.12,M.wallGlass, 0,0.9+(CH-0.9)/2,8.5); // reception glass

// ── Windows ───────────────────────────────────────────────────────────────────
function win(x,y,z,w,h,ax){
  const fr=mat(0xd0cfc8,0.5);
  if(ax==='z'){ b(w+0.08,h+0.08,0.06,fr,x,y,z); b(w,h,0.04,M.winGlow,x,y,z); }
  else         { b(0.06,h+0.08,w+0.08,fr,x,y,z); b(0.04,h,w,M.winGlow,x,y,z); }
}
win(-4,2,-8,2.5,1.4,'z'); win(2,2,-8,2.5,1.4,'z'); win(7,2,-8,2.5,1.4,'z');
win(-12,2,-5.5,2,1.4,'x'); win(-12,2,-4,2,1.4,'x');
win(-7,2,8.5,2.5,1.4,'z'); win(7,2,8.5,2.5,1.4,'z');

function blindSlats(x,y,z,w,ax){
  for(let i=0;i<14;i++){ const yy=y-0.58+i*(1.16/14);
    if(ax==='z') b(w-0.06,0.03,0.01,M.blinds,x,yy,z-0.04);
    else         b(0.01,0.03,w-0.06,M.blinds,x-0.04,yy,z); }
}
blinds(-4,2,-8,2.5,'z'); blindSlats(2,2,-8,2.5,'z'); blindSlats(7,2,-8,2.5,'z');
blinds(-12,2,-5.5,2,'x'); blindSlats(-12,2,-4,2,'x');

// ── Interior walls ────────────────────────────────────────────────────────────
// Michael's office (x -12 to -7, z -8 to -3)
b(5,CH,0.12,M.wallGlass,-9.5,CH/2,-3.0); // south glass
b(0.12,CH,1.6,M.wallGlass,-7,CH/2,-3.8); // east glass
b(0.12,0.8,1.2,M.wallGlass,-7,CH-0.4,-4.7); // door top
b(0.12,CH,2.2,M.wallGlass,-7,CH/2,-6.5); // east back
b(5,CH,0.12,M.wall,-9.5,CH/2,-3.0); // solid divider to conf
// Conference room (z -3 to +4)
b(0.12,CH,2.0,M.wallGlass,-7,CH/2,-1.5);
b(0.12,0.8,1.2,M.wallGlass,-7,CH-0.4,0.1);
b(0.12,CH,2.6,M.wallGlass,-7,CH/2,2.0);
b(5,CH,0.12,M.wallGlass,-9.5,CH/2,3.8);
// Break room
b(0.12,CH,4.5,M.wall,-7,CH/2,6.25);
b(5,CH,0.12,M.wall,-9.5,CH/2,4.0);
// Annex
b(0.12,CH,4.7,M.wall,7,CH/2,6.15);
b(5,CH,0.12,M.wall,9.5,CH/2,3.8);

// ── Furniture helpers ─────────────────────────────────────────────────────────
function monitor(x,y,z,ry=0){
  const g=new THREE.Group();
  const sc=new THREE.Mesh(bg(0.44,0.33,0.04),M.screenCase); sc.position.y=0.165; g.add(sc);
  const sf=new THREE.Mesh(bg(0.40,0.29,0.015),M.screen); sf.position.set(0,0.165,0.028); g.add(sf);
  const nk=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,0.22,8),M.metal); nk.position.y=-0.11; g.add(nk);
  const bs=new THREE.Mesh(bg(0.2,0.018,0.16),M.metal); bs.position.y=-0.23; g.add(bs);
  g.position.set(x,y+0.34,z); g.rotation.y=ry;
  g.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;}}); scene.add(g);
}

function chair(x,z,ry=0,col=0x1c1c1c){
  const cmat=mat(col,0.8);
  const g=new THREE.Group();
  const se=new THREE.Mesh(bg(0.52,0.08,0.5),cmat); se.position.y=0.5; g.add(se);
  const bk=new THREE.Mesh(bg(0.5,0.58,0.07),cmat); bk.position.set(0,0.84,-0.22); g.add(bk);
  const po=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.46,8),M.metal); po.position.y=0.23; g.add(po);
  const st=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,0.035,5),M.metal); st.position.y=0.035; g.add(st);
  [-0.27,0.27].forEach(ox=>{ const ar=new THREE.Mesh(bg(0.055,0.055,0.32),cmat); ar.position.set(ox,0.7,-0.05); g.add(ar); });
  g.position.set(x,0,z); g.rotation.y=ry;
  g.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;}}); scene.add(g);
}

function desk(x,z,ry=0){
  const g=new THREE.Group();
  const tp=new THREE.Mesh(bg(1.55,0.05,0.82),M.deskL); tp.position.y=0.76; g.add(tp);
  [[-0.68,-0.36],[0.68,-0.36],[-0.68,0.36],[0.68,0.36]].forEach(([lx,lz])=>{
    const lg=new THREE.Mesh(bg(0.05,0.76,0.05),M.deskL); lg.position.set(lx,0.38,lz); g.add(lg);
  });
  const pd=new THREE.Mesh(bg(0.42,0.62,0.52),M.deskL); pd.position.set(0.52,0.31,0); g.add(pd);
  g.position.set(x,0,z); g.rotation.y=ry;
  g.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;}}); scene.add(g);
}

function divider(x,z,len,ry=0,h=1.32){
  const g=new THREE.Group();
  const pn=new THREE.Mesh(bg(len,h,0.055),M.cubicle); pn.position.y=h/2; g.add(pn);
  const tp=new THREE.Mesh(bg(len+0.02,0.04,0.065),M.cubicleTop); tp.position.y=h; g.add(tp);
  g.position.set(x,0,z); g.rotation.y=ry;
  g.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;}}); scene.add(g);
}

// ── Reception ─────────────────────────────────────────────────────────────────
b(3.8,1.1,0.55,M.deskD, 0.2,0.55,6.6);   b(3.9,0.05,0.6,M.deskL, 0.2,1.1,6.6);
b(0.55,1.1,2.2,M.deskD,2.25,0.55,5.6);   b(0.6,0.05,2.3,M.deskL,2.25,1.1,5.6);
b(0.9,0.08,0.02,M.navy,0.2,0.65,6.3);    // "Dunder Mifflin" plaque
b(0.2,0.04,0.14,M.plastic,-0.8,1.12,6.35); // phone
b(0.08,0.12,0.08,mat(0xff6699,0.8),-0.6,1.12,6.42); // Pam's mug
b(0.15,0.22,0.08,mat(0x556b8a,0.7),-0.3,1.12,6.35); // photo frame
monitor(0.9,1.08,6.3,Math.PI);
chair(-0.2,6.1,Math.PI);
// Waiting sofa
(()=>{
  const g=new THREE.Group(), w=2.4;
  const se=new THREE.Mesh(bg(w,0.2,0.72),M.couch); se.position.y=0.44; g.add(se);
  const bk=new THREE.Mesh(bg(w,0.52,0.14),M.couch); bk.position.set(0,0.78,-0.29); g.add(bk);
  [-w/2,w/2].forEach(ox=>{ const ar=new THREE.Mesh(bg(0.14,0.54,0.72),M.couch); ar.position.set(ox,0.61,0); g.add(ar); });
  g.position.set(4.5,0,7.5); g.rotation.y=Math.PI;
  g.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;}}); scene.add(g);
})();
b(1.0,0.04,0.55,M.deskD,4.5,0.46,6.7);
b(0.24,0.008,0.18,M.red,4.3,0.48,6.75); b(0.22,0.008,0.16,M.blue,4.55,0.49,6.65);

// ── Bullpen ───────────────────────────────────────────────────────────────────
// Dwight's desk
desk(-1.2,-3.2,0); monitor(-1.2,0.78,-3.4); chair(-1.2,-2.4,Math.PI);
b(0.28,0.03,0.08,M.brown,-1.0,0.79,-3.0); // name plate
b(0.14,0.12,0.05,mat(0x882222),-0.7,0.8,-3.15); // beet prop
// Jim's desk
desk(-1.2,-1.6,Math.PI); monitor(-1.2,0.78,-1.4,Math.PI); chair(-1.2,-2.4,0);
b(0.1,0.1,0.08,mat(0xcc8844),-1.6,0.8,-1.52); // Jim's mug
divider(-2.5,-2.4,2.5,0); divider(-1.2,-4.2,2.8,Math.PI/2); divider(-1.2,-0.6,2.8,Math.PI/2);

// Oscar
desk(1.5,-3.2,0); monitor(1.5,0.78,-3.4); chair(1.5,-2.4,Math.PI);
b(0.18,0.14,0.04,mat(0x336688),1.8,0.8,-3.05);
// Kevin
desk(1.5,-1.6,Math.PI); monitor(1.5,0.78,-1.4,Math.PI); chair(1.5,-2.4,0);
b(0.12,0.1,0.08,mat(0x885522),1.9,0.8,-1.55); // snack bag
divider(0.2,-2.4,2.5,0); divider(1.5,-4.2,2.8,Math.PI/2); divider(1.5,-0.6,2.8,Math.PI/2);

// Angela
desk(4.2,-3.8,0); monitor(4.2,0.78,-4.0); chair(4.2,-3.0,Math.PI);
[0,0.08,0.16,0.24].forEach((ox,i)=>{ // cat figurines
  const cm=mat([0xffcc88,0x886644,0xf5f5f5,0x444444][i]);
  b(0.04,0.07,0.04,cm,3.9+ox,0.82,-3.68); b(0.03,0.04,0.03,cm,3.9+ox,0.9,-3.68);
});
divider(2.9,-2.4,2.5,0); divider(4.2,-5.0,3.0,Math.PI/2);

// Phyllis
desk(5.8,-2.4,0); monitor(5.8,0.78,-2.6); chair(5.8,-1.6,Math.PI);
b(0.16,0.1,0.08,mat(0xff88aa),5.5,0.8,-2.3);
// Stanley
desk(8.0,-2.4,0); monitor(8.0,0.78,-2.6); chair(8.0,-1.6,Math.PI);
b(0.22,0.005,0.25,M.paper,8.3,0.79,-2.2); // crossword
// Meredith
desk(5.5,0.5,0); monitor(5.5,0.78,0.3); chair(5.5,1.3,Math.PI);
// Ryan
desk(8.0,0.5,0); monitor(8.0,0.78,0.3); chair(8.0,1.3,Math.PI);
// Creed
desk(5.5,-5.5,0); monitor(5.5,0.78,-5.7); chair(5.5,-4.7,Math.PI);

// ── Filing cabinets ───────────────────────────────────────────────────────────
[[-5.5,-7.5],[-6.1,-7.5],[-6.7,-7.5],[10.5,-6.5],[11.0,-6.5],[10.5,-4.5],[11.0,-4.5],[10.5,-2.5]]
  .forEach(([x,z])=>{ b(0.48,1.1,0.62,M.filingCab,x,0.55,z); for(let i=0;i<3;i++) b(0.32,0.018,0.01,M.metal,x,0.22+i*0.35,z+0.32); });

// ── Minimap ───────────────────────────────────────────────────────────────────
const mc=document.getElementById('minimap'), mx=mc.getContext('2d');
mc.width=160; mc.height=110;
function drawMap(){
  mx.fillStyle='rgba(18,16,12,.88)'; mx.fillRect(0,0,160,110);
  const s=5.5, ox=80, oz=55;
  const wx=x=>ox+x*s, wz=z=>oz+z*s;
  mx.strokeStyle='#888'; mx.lineWidth=1; mx.strokeRect(wx(-12),wz(-8),24*s,17*s);
  mx.strokeStyle='#4af'; mx.lineWidth=.6;
  mx.strokeRect(wx(-12),wz(-8),5*s,5*s);
  mx.strokeRect(wx(-12),wz(-3),5*s,7*s);
  mx.strokeStyle='#8f8'; mx.lineWidth=.6;
  mx.strokeRect(wx(-12),wz(4),5*s,4.5*s);
  mx.strokeRect(wx(7),wz(4),5*s,4.5*s);
  const px=camera.position.x, pz=camera.position.z;
  mx.fillStyle='#ff4'; mx.beginPath(); mx.arc(wx(px),wz(pz),2.5,0,Math.PI*2); mx.fill();
  const d=new THREE.Vector3(); camera.getWorldDirection(d);
  mx.strokeStyle='#ff4'; mx.lineWidth=1;
  mx.beginPath(); mx.moveTo(wx(px),wz(pz)); mx.lineTo(wx(px+d.x*2.5),wz(pz+d.z*2.5)); mx.stroke();
  mx.fillStyle='rgba(255,255,180,.65)'; mx.font='7px Arial';
  ['M','Conf','Break','Annex','Recep.'].forEach((t,[tx,tz])=>mx.fillText(t,wx(tx),wz(tz)),
    [[-10.5,-5.5],[-11.5,.2],[-11.8,5.2],[7.2,5.2],[-1,6.8]]);
}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clk.getDelta(),.05);
  const spd=(keys['ShiftLeft']||keys['ShiftRight'])?7.5:3.5;
  vel.x-=vel.x*12*dt; vel.z-=vel.z*12*dt;
  if(controls.isLocked){
    vel.z-=((keys['KeyW']||keys['ArrowUp']?1:0)-(keys['KeyS']||keys['ArrowDown']?1:0))*spd*dt*14;
    vel.x-=((keys['KeyA']||keys['ArrowLeft']?1:0)-(keys['KeyD']||keys['ArrowRight']?1:0))*spd*dt*14;
    controls.moveForward(-vel.z*dt);
    controls.moveRight(-vel.x*dt);
    const p=controls.getObject().position;
    p.x=Math.max(-11.5,Math.min(11.5,p.x));
    p.z=Math.max(-7.7,Math.min(8.2,p.z));
    p.y=EY;
  }
  drawMap();
  renderer.render(scene,camera);
}
