<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dunder Mifflin - The Office</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #1a1a1a; font-family: Arial, sans-serif; }
    canvas { display: block; }
    #hud {
      position: absolute; top: 12px; left: 12px;
      color: #fff; font-size: 13px; line-height: 1.6;
      background: rgba(0,0,0,0.55); padding: 10px 14px;
      border-radius: 6px; pointer-events: none;
      border: 1px solid rgba(255,255,255,0.12);
    }
    #hud b { color: #ffd700; display: block; margin-bottom: 4px; font-size: 14px; }
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      color: rgba(255,255,255,0.7); font-size: 22px;
      pointer-events: none; text-shadow: 0 0 4px #000;
    }
    #overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.72); color: #fff; flex-direction: column;
      cursor: pointer;
    }
    #overlay h1 { font-size: 2.2em; color: #ffd700; margin-bottom: 8px; }
    #overlay p { font-size: 1.05em; opacity: 0.85; }
    #overlay.hidden { display: none; }
    #minimap {
      position: absolute; bottom: 12px; right: 12px;
      width: 160px; height: 110px;
      background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px; overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <h1>Dunder Mifflin Paper Co.</h1>
    <p>Scranton, PA &mdash; Branch Office</p>
    <p style="margin-top:16px; font-size:0.95em; opacity:0.7;">Click to explore &bull; WASD to move &bull; Mouse to look &bull; Shift to run</p>
  </div>
  <div id="hud">
    <b>Dunder Mifflin &mdash; Scranton</b>
    WASD / Arrows: Move &nbsp;|&nbsp; Mouse: Look<br>
    Shift: Run &nbsp;|&nbsp; ESC: Release cursor
  </div>
  <div id="crosshair">+</div>
  <canvas id="minimap"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

RectAreaLightUniformsLib.init();

// ─── RENDERER ────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// ─── SCENE ───────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc8d8e8);
scene.fog = new THREE.Fog(0xd0c8bc, 18, 55);

// ─── CAMERA ──────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.05, 80);
camera.position.set(1, 1.72, 7.5);

// ─── CONTROLS ────────────────────────────────────────────────────────────────
const controls = new PointerLockControls(camera, renderer.domElement);
scene.add(controls.getObject());

const overlay = document.getElementById('overlay');
overlay.addEventListener('click', () => controls.lock());
controls.addEventListener('lock', () => overlay.classList.add('hidden'));
controls.addEventListener('unlock', () => overlay.classList.remove('hidden'));

// ─── MATERIALS ───────────────────────────────────────────────────────────────
const M = {
  carpet:     new THREE.MeshStandardMaterial({ color: 0x7a6b52, roughness: 0.98 }),
  carpetConf: new THREE.MeshStandardMaterial({ color: 0x5a6a7a, roughness: 0.98 }),
  wallOff:    new THREE.MeshStandardMaterial({ color: 0xe2ddd4, roughness: 0.85 }),
  wallGlass:  new THREE.MeshStandardMaterial({ color: 0xb8d4e8, transparent: true, opacity: 0.22, roughness: 0.05, side: THREE.DoubleSide }),
  ceiling:    new THREE.MeshStandardMaterial({ color: 0xf2f0ec, roughness: 0.95 }),
  tileGrid:   new THREE.MeshStandardMaterial({ color: 0xd8d5cf, roughness: 0.9 }),
  deskLight:  new THREE.MeshStandardMaterial({ color: 0xc8a870, roughness: 0.55 }),
  deskDark:   new THREE.MeshStandardMaterial({ color: 0x5c3318, roughness: 0.6 }),
  chairBlack: new THREE.MeshStandardMaterial({ color: 0x1c1c1c, roughness: 0.8 }),
  metal:      new THREE.MeshStandardMaterial({ color: 0x909090, metalness: 0.75, roughness: 0.3 }),
  metalDark:  new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.7, roughness: 0.4 }),
  glass:      new THREE.MeshStandardMaterial({ color: 0x88bbdd, transparent: true, opacity: 0.28, roughness: 0.04 }),
  wood:       new THREE.MeshStandardMaterial({ color: 0x7a5428, roughness: 0.7 }),
  woodLight:  new THREE.MeshStandardMaterial({ color: 0xb07840, roughness: 0.65 }),
  whiteboard: new THREE.MeshStandardMaterial({ color: 0xf8f8f6, roughness: 0.4 }),
  screen:     new THREE.MeshStandardMaterial({ color: 0x2255aa, emissive: 0x102040, emissiveIntensity: 0.8, roughness: 0.1 }),
  screenDark: new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.25, metalness: 0.5 }),
  cubicle:    new THREE.MeshStandardMaterial({ color: 0x9e8e7a, roughness: 0.92 }),
  cubicleTop: new THREE.MeshStandardMaterial({ color: 0x7a6b58, roughness: 0.9 }),
  filingCab:  new THREE.MeshStandardMaterial({ color: 0x828278, metalness: 0.55, roughness: 0.45 }),
  paper:      new THREE.MeshStandardMaterial({ color: 0xfcfcf4, roughness: 0.92 }),
  blinds:     new THREE.MeshStandardMaterial({ color: 0xd8ceaa, roughness: 0.8, side: THREE.DoubleSide }),
  couchBrown: new THREE.MeshStandardMaterial({ color: 0x7a4820, roughness: 0.88 }),
  windowGlow: new THREE.MeshStandardMaterial({ color: 0xd8eeff, emissive: 0x6090c0, emissiveIntensity: 0.4, transparent: true, opacity: 0.35 }),
  fluorescent:new THREE.MeshStandardMaterial({ color: 0xfff8e8, emissive: 0xfff0c8, emissiveIntensity: 3.5, roughness: 0.1 }),
  lightFixture:new THREE.MeshStandardMaterial({ color: 0xe8e8e0, roughness: 0.6 }),
  plastic:    new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.4 }),
  black:      new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.7 }),
  navy:       new THREE.MeshStandardMaterial({ color: 0x0a2060, roughness: 0.6 }),
  gold:       new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 }),
  green:      new THREE.MeshStandardMaterial({ color: 0x228822, roughness: 0.9 }),
  red:        new THREE.MeshStandardMaterial({ color: 0xaa2222, roughness: 0.7 }),
  blue:       new THREE.MeshStandardMaterial({ color: 0x2244aa, roughness: 0.6 }),
};

// ─── GEOMETRY HELPERS ────────────────────────────────────────────────────────
function addMesh(geo, mat, x, y, z, rx=0, ry=0, rz=0, shadow=true) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  if (shadow) { m.castShadow = true; m.receiveShadow = true; }
  scene.add(m); return m;
}
const _bCache = {};
function bGeo(w,h,d) {
  const k=`${w}x${h}x${d}`; if(!_bCache[k]) _bCache[k]=new THREE.BoxGeometry(w,h,d);
  return _bCache[k];
}
function b(w,h,d,mat,x,y,z,rx=0,ry=0,rz=0) {
  return addMesh(bGeo(w,h,d), mat, x,y,z, rx,ry,rz);
}
function cyl(rt,rb,h,seg,mat,x,y,z,rx=0,ry=0,rz=0) {
  return addMesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat, x,y,z,rx,ry,rz);
}
function sph(r,seg,mat,x,y,z) {
  return addMesh(new THREE.SphereGeometry(r,seg,seg), mat, x,y,z);
}

// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const CH  = 3.05;  // ceiling height
const WT  = 0.12;  // wall thickness
const EYE = 1.72;  // camera eye height

// ─── LIGHTING ────────────────────────────────────────────────────────────────
const ambLight = new THREE.AmbientLight(0xfff5e8, 0.55);
scene.add(ambLight);

// Exterior daylight
const sun = new THREE.DirectionalLight(0xfff8f0, 0.6);
sun.position.set(8, 12, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 60;
sun.shadow.camera.left = -25;
sun.shadow.camera.right = 25;
sun.shadow.camera.top = 20;
sun.shadow.camera.bottom = -20;
sun.shadow.bias = -0.001;
scene.add(sun);

function addFluorescentFixture(x, z, len=1.1) {
  // Fixture housing
  b(len, 0.06, 0.28, M.lightFixture, x, CH-0.03, z);
  // Glowing tube
  b(len-0.05, 0.025, 0.08, M.fluorescent, x, CH-0.035, z);
  
  // RectAreaLight for bounce
  const rl = new THREE.RectAreaLight(0xfff8e4, 14, len, 0.28);
  rl.position.set(x, CH-0.07, z);
  rl.rotation.x = Math.PI / 2;
  scene.add(rl);
  
  // Point light for shadow casting
  const pl = new THREE.PointLight(0xfff5dc, 1.4, 7, 1.8);
  pl.position.set(x, CH-0.15, z);
  pl.castShadow = true;
  pl.shadow.mapSize.set(256, 256);
  pl.shadow.bias = -0.002;
  scene.add(pl);
}

// Bullpen lights
for (let xi = -1; xi <= 10; xi += 3.2) {
  for (let zi = -6.5; zi <= 2.5; zi += 3.0) {
    addFluorescentFixture(xi, zi);
  }
}
// Michael's office
addFluorescentFixture(-9.5, -5.8);
addFluorescentFixture(-9.5, -3.8);
// Conference room
addFluorescentFixture(-9.8, -0.5);
addFluorescentFixture(-8.4, -0.5);
addFluorescentFixture(-9.1, 1.5);
// Break room
addFluorescentFixture(-9.8, 5.2);
addFluorescentFixture(-8.5, 5.2);
// Annex
addFluorescentFixture(9.5, 5.5);
addFluorescentFixture(9.5, 7.0);
// Reception
addFluorescentFixture(1.0, 5.8);
addFluorescentFixture(3.5, 5.8);

// ─── FLOOR ───────────────────────────────────────────────────────────────────
// Main bullpen carpet
b(22, 0.06, 14, M.carpet,     1,  -0.03,  -1);
// Conference room carpet (darker blue-grey)
b( 6, 0.06,  7, M.carpetConf, -9, -0.03, -0.5);
// Reception tile (lighter)
b( 9, 0.06,  5, new THREE.MeshStandardMaterial({color:0xd8d0c0,roughness:0.6}), 3, -0.03, 6);
// Break room linoleum
b( 6, 0.06,  6, new THREE.MeshStandardMaterial({color:0xc8c0a8,roughness:0.7}), -9, -0.03, 5.5);
// Annex carpet
b( 6, 0.06,  6, new THREE.MeshStandardMaterial({color:0x8a7c6a,roughness:0.95}), 9, -0.03, 5.5);

// ─── CEILING TILES ───────────────────────────────────────────────────────────
// Main tile field
const tileW = 1.22, tileD = 0.61;
const tileMats = [
  new THREE.MeshStandardMaterial({color:0xf0ede8, roughness:0.96}),
  new THREE.MeshStandardMaterial({color:0xece9e4, roughness:0.96})
];
for (let xi = -11; xi < 12; xi += tileW) {
  for (let zi = -8; zi < 9; zi += tileD) {
    const m = new THREE.Mesh(bGeo(tileW-0.012, 0.04, tileD-0.012), tileMats[(Math.floor(xi+zi))&1]);
    m.position.set(xi + tileW/2, CH, zi + tileD/2);
    m.receiveShadow = true;
    scene.add(m);
  }
}

// ─── EXTERIOR WALLS ──────────────────────────────────────────────────────────
// North wall (back)
b(24, CH, WT, M.wallOff, 0, CH/2, -8);
// West wall
b(WT, CH, 17, M.wallOff, -12, CH/2, 0.5);
// East wall  
b(WT, CH, 17, M.wallOff,  12, CH/2, 0.5);
// South wall - split around entrance
b(7, CH, WT, M.wallOff, -8.5, CH/2, 8.5);
b(7, CH, WT, M.wallOff,  8.5, CH/2, 8.5);
// Reception front glass above low wall
b(10, 0.9, WT, M.wallOff, 0, 0.45, 8.5);
b(10, CH-0.9, WT, M.wallGlass, 0, 0.9+(CH-0.9)/2, 8.5);

// ─── WINDOWS ─────────────────────────────────────────────────────────────────
function addWindow(x, y, z, w, h, axis) {
  const frameMat = new THREE.MeshStandardMaterial({color:0xd0cfc8, roughness:0.5});
  if (axis === 'z') {
    b(w+0.08, h+0.08, 0.06, frameMat, x, y, z);
    b(w, h, 0.04, M.windowGlow, x, y, z);
  } else {
    b(0.06, h+0.08, w+0.08, frameMat, x, y, z);
    b(0.04, h, w, M.windowGlow, x, y, z);
  }
}
// North windows (bullpen back)
addWindow(-4, 2.0, -8.0, 2.5, 1.4, 'z');
addWindow( 2, 2.0, -8.0, 2.5, 1.4, 'z');
addWindow( 7, 2.0, -8.0, 2.5, 1.4, 'z');
// West windows (Michael)
addWindow(-12.0, 2.0, -5.5, 2.0, 1.4, 'x');
addWindow(-12.0, 2.0, -4.0, 2.0, 1.4, 'x');
// South windows
addWindow(-7, 2.0, 8.5, 2.5, 1.4, 'z');
addWindow( 7, 2.0, 8.5, 2.5, 1.4, 'z');

// Blinds on windows
function addBlinds(x, y, z, w, axis) {
  const slats = 14;
  for (let i = 0; i < slats; i++) {
    const yy = y - 0.6 + i * (1.2 / slats);
    if (axis === 'z') b(w-0.05, 0.035, 0.01, M.blinds, x, yy, z - 0.04);
    else              b(0.01, 0.035, w-0.05, M.blinds, x - 0.04, yy, z);
  }
}
addBlinds(-4, 2.0, -8.0, 2.5, 'z');
addBlinds( 2, 2.0, -8.0, 2.5, 'z');
addBlinds( 7, 2.0, -8.0, 2.5, 'z');
addBlinds(-12.0, 2.0, -5.5, 2.0, 'x');
addBlinds(-12.0, 2.0, -4.0, 2.0, 'x');

// Window light fill
const winLight1 = new THREE.SpotLight(0xd8eeff, 1.2, 12, 0.6, 0.5);
winLight1.position.set(-11, 2.5, -5);
winLight1.target.position.set(0, 0, 0);
scene.add(winLight1); scene.add(winLight1.target);

// ─── INTERIOR WALLS ──────────────────────────────────────────────────────────

// Michael's office walls (x: -12 to -7, z: -8 to -3)
// Glass south wall facing bullpen
b(5, CH, WT, M.wallGlass, -9.5, CH/2, -3.0);
// Glass east wall – with door opening (2-7m from south)
b(WT, CH, 1.6, M.wallGlass, -7.0, CH/2, -3.8);
// Door frame top
b(WT, 0.8, 1.2, M.wallGlass, -7.0, CH-0.4, -4.7);
// Rest of east glass
b(WT, CH, 2.2, M.wallGlass, -7.0, CH/2, -6.5);

// Divider between Michael's office & conference room (solid wall)
b(5, CH, WT, M.wallOff, -9.5, CH/2, -3.0);

// Conference room walls (x: -12 to -7, z: -3 to 4)
// Glass east wall – with door
b(WT, CH, 2.0, M.wallGlass, -7.0, CH/2, -1.5);
b(WT, 0.8, 1.2, M.wallGlass, -7.0, CH-0.4, 0.1);
b(WT, CH, 2.6, M.wallGlass, -7.0, CH/2, 2.0);
// Glass south wall of conference room
b(5, CH, WT, M.wallGlass, -9.5, CH/2, 3.8);

// Break room walls (x: -12 to -7, z: 4 to 8.5)
b(WT, CH, 4.5, M.wallOff, -7.0, CH/2, 6.25);
b(5, CH, WT, M.wallOff, -9.5, CH/2, 4.0);

// Annex walls (x: 7 to 12, z: 3.8 to 8.5)
b(WT, CH, 4.7, M.wallOff,  7.0, CH/2, 6.15);
b(5, CH, WT, M.wallOff,  9.5, CH/2, 3.8);
// Annex door opening handled by omission

// ─── CEILING GRID STRIPS ─────────────────────────────────────────────────────
const gridMat = new THREE.MeshStandardMaterial({color:0xb8b5b0, roughness:0.7});
for (let xi = -11; xi <= 11; xi += tileW) {
  b(0.025, 0.025, 18, gridMat, xi, CH+0.012, 0);
}
for (let zi = -8; zi <= 9; zi += tileD) {
  b(24, 0.025, 0.025, gridMat, 0, CH+0.012, zi);
}

// ─── RECEPTION AREA ──────────────────────────────────────────────────────────
// Main reception counter
b(3.8, 1.1, 0.55, M.deskDark, 0.2, 0.55, 6.6);
b(3.9, 0.05, 0.6, M.deskLight, 0.2, 1.1, 6.6);
// Return leg of L
b(0.55, 1.1, 2.2, M.deskDark, 2.25, 0.55, 5.6);
b(0.6, 0.05, 2.3, M.deskLight, 2.25, 1.1, 5.6);
// Dunder Mifflin name plate on counter front
b(0.9, 0.08, 0.02, M.navy, 0.2, 0.65, 6.3);
// Phone
b(0.2, 0.04, 0.14, M.plastic, -0.8, 1.12, 6.35);
b(0.16, 0.06, 0.06, M.black, -0.8, 1.16, 6.28);
// Monitor
function desk_monitor(x, y, z, ry=0) {
  const g = new THREE.Group();
  const screen = new THREE.Mesh(bGeo(0.44, 0.33, 0.04), M.screenDark); screen.position.y = 0.165; g.add(screen);
  const face = new THREE.Mesh(bGeo(0.40, 0.29, 0.015), M.screen); face.position.set(0, 0.165, 0.028); g.add(face);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.22, 8), M.metal); neck.position.y = -0.11; g.add(neck);
  const base = new THREE.Mesh(bGeo(0.2, 0.018, 0.16), M.metal); base.position.y = -0.23; g.add(base);
  g.position.set(x, y+0.34, z);
  g.rotation.y = ry;
  g.traverse(c => { if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; } });
  scene.add(g);
}
desk_monitor(0.9, 1.08, 6.3, Math.PI);
// Pam's personal items
b(0.15, 0.22, 0.08, new THREE.MeshStandardMaterial({color:0x556b8a,roughness:0.7}), -0.3, 1.12, 6.35); // small frame
b(0.08, 0.12, 0.08, new THREE.MeshStandardMaterial({color:0xff6699,roughness:0.8}), -0.6, 1.12, 6.42);  // mug

// Reception chair
function office_chair(x, z, ry=0, color=0x1c1c1c) {
  const mat = new THREE.MeshStandardMaterial({color, roughness:0.8});
  const g = new THREE.Group();
  const seat = new THREE.Mesh(bGeo(0.52, 0.08, 0.5), mat); seat.position.y = 0.5; g.add(seat);
  const back = new THREE.Mesh(bGeo(0.5, 0.58, 0.07), mat); back.position.set(0, 0.84, -0.22); g.add(back);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.45, 8), M.metal); pole.position.y = 0.23; g.add(pole);
  const star = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.035, 5), M.metal); star.position.y = 0.035; g.add(star);
  [-0.27, 0.27].forEach(ox => {
    const arm = new THREE.Mesh(bGeo(0.055, 0.055, 0.32), mat); arm.position.set(ox, 0.7, -0.05); g.add(arm);
  });
  g.position.set(x, 0, z);
  g.rotation.y = ry;
  g.traverse(c => { if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; } });
  scene.add(g);
}
office_chair(-0.2, 6.1, Math.PI);

// Waiting area sofa
function sofa(x, z, w, ry=0) {
  const g = new THREE.Group();
  const mat = M.couchBrown;
  const seat = new THREE.Mesh(bGeo(w, 0.2, 0.72), mat); seat.position.y = 0.44; g.add(seat);
  const back = new THREE.Mesh(bGeo(w, 0.52, 0.14), mat); back.position.set(0, 0.78, -0.29); g.add(back);
  [-w/2, w/2].forEach(ox => {
    const arm = new THREE.Mesh(bGeo(0.14, 0.54, 0.72), mat); arm.position.set(ox, 0.61, 0); g.add(arm);
  });
  [[-w/2+0.18, -0.3],[w/2-0.18,-0.3],[-w/2+0.18,0.3],[w/2-0.18,0.3]].forEach(([ox,oz]) => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.35, 6), M.wood); leg.position.set(ox, 0.175, oz); g.add(leg);
  });
  g.position.set(x, 0, z);
  g.rotation.y = ry;
  g.traverse(c => { if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; } });
  scene.add(g);
}
sofa(4.5, 7.5, 2.4, Math.PI);

// Coffee table
b(1.0, 0.04, 0.55, M.deskDark, 4.5, 0.46, 6.7);
b(0.9, 0.42, 0.45, M.wood, 4.5, 0.21, 6.7);
// Magazines
b(0.24, 0.008, 0.18, M.red, 4.3, 0.48, 6.75);
b(0.22, 0.008, 0.16, M.blue, 4.55, 0.49, 6.65);

// ─── DESK FUNCTION ───────────────────────────────────────────────────────────
function work_desk(x, z, ry=0, hasReturn=false) {
  const g = new THREE.Group();
  const top = new THREE.Mesh(bGeo(1.55, 0.05, 0.82), M.deskLight); top.position.y = 0.76; g.add(top);
  [[-0.68,-0.36],[0.68,-0.36],[-0.68,0.36],[0.68,0.36]].forEach(([lx,lz]) => {
    const leg = new THREE.Mesh(bGeo(0.05, 0.76, 0.05), M.deskLight); leg.position.set(lx, 0.38, lz); g.add(leg);
  });
  const pedestal = new THREE.Mesh(bGeo(0.42, 0.62, 0.52), M.deskLight); pedestal.position.set(0.52, 0.31, 0); g.add(pedestal);

  scene.add(grp);
}

const velocity = new THREE.Vector3();
const clock = new THREE.Clock();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Minimap
const miniCanvas = document.getElementById('minimap');
const mCtx = miniCanvas.getContext('2d');
miniCanvas.width = 160;
miniCanvas.height = 110;

function drawMinimap() {
  mCtx.fillStyle = 'rgba(20,18,14,0.85)';
  mCtx.fillRect(0, 0, 160, 110);
  // rooms
  const scale = 5.5;
  const ox = 80, oz = 55;
  function wx(x) { return ox + x * scale; }
  function wz(z) { return oz + z * scale; }
  // Floor outline
  mCtx.strokeStyle = '#888'; mCtx.lineWidth = 1;
  mCtx.strokeRect(wx(-12), wz(-8), 24*scale, 17*scale);
  // Michael office
  mCtx.strokeStyle = '#4af'; mCtx.lineWidth = 0.5;
  mCtx.strokeRect(wx(-12), wz(-8), 5*scale, 5*scale);
  // Conf room
  mCtx.strokeRect(wx(-12), wz(-3), 5*scale, 7*scale);
  // Break
  mCtx.strokeStyle = '#8f8'; mCtx.lineWidth = 0.5;
  mCtx.strokeRect(wx(-12), wz(4), 5*scale, 4.5*scale);
  // Annex
  mCtx.strokeRect(wx(7), wz(4), 5*scale, 4.5*scale);
  // Player dot
  const px = camera.position.x, pz = camera.position.z;
  mCtx.fillStyle = '#ff4'; mCtx.beginPath();
  mCtx.arc(wx(px), wz(pz), 2.5, 0, Math.PI*2); mCtx.fill();
  // Direction indicator
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  mCtx.strokeStyle = '#ff4'; mCtx.lineWidth = 1;
  mCtx.beginPath();
  mCtx.moveTo(wx(px), wz(pz));
  mCtx.lineTo(wx(px + dir.x*2.5), wz(pz + dir.z*2.5));
  mCtx.stroke();
  // Label
  mCtx.fillStyle = 'rgba(255,255,200,0.6)'; mCtx.font = '7px Arial';
  mCtx.fillText('M', wx(-10.5), wz(-5.5));
  mCtx.fillText('Conf', wx(-11.5), wz(0.2));
  mCtx.fillText('Break', wx(-11.8), wz(5.2));
  mCtx.fillText('Annex', wx(7.2), wz(5.2));
  mCtx.fillText('Reception', wx(-1), wz(6.5));
}

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);
  const speed = (keys['ShiftLeft'] || keys['ShiftRight']) ? 7.5 : 3.5;
  const damping = 12;

  velocity.x -= velocity.x * damping * delta;
  velocity.z -= velocity.z * damping * delta;

  if (controls.isLocked) {
    const fwd  = (keys['KeyW'] || keys['ArrowUp'])    ? 1 : 0;
    const bwd  = (keys['KeyS'] || keys['ArrowDown'])  ? 1 : 0;
    const left = (keys['KeyA'] || keys['ArrowLeft'])  ? 1 : 0;
    const rgt  = (keys['KeyD'] || keys['ArrowRight']) ? 1 : 0;
    velocity.z -= (fwd - bwd) * speed * delta * 14;
    velocity.x -= (left - rgt) * speed * delta * 14;
    controls.moveForward(-velocity.z * delta);
    controls.moveRight(-velocity.x * delta);
    // Clamp to office bounds
    const pos = controls.getObject().position;
    pos.x = Math.max(-11.5, Math.min(11.5, pos.x));
    pos.z = Math.max(-7.7, Math.min(8.2, pos.z));
    pos.y = EYE;
  }
  drawMinimap();
  renderer.render(scene, camera);
}
animate();
  </script>
</body>
</html>
